<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>GDF'27 UCMS</title>
<link rel="icon" href="images/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=Alexandria:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="admin/ucms.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/grapesjs@0.21.13/dist/css/grapes.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/grapesjs@0.21.13/dist/grapes.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/css/css.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="cms-config.js"></script>
<script src="translations.js"></script>
<script src="cms-defaults.js"></script>
<script src="admin-i18n.js"></script>
<script src="admin-ucms-i18n.js"></script>
<script defer src="admin.js"></script>
<script defer src="admin/ucms-core.js"></script>
<script defer src="admin/pages-shared.js"></script>
<script defer src="admin/pages-dashboard.js"></script>
<script defer src="admin/pages-website.js"></script>
<script defer src="admin/pages-content.js"></script>
<script defer src="admin/pages-builder.js"></script>
<script defer src="admin/pages-system.js"></script>
<script defer src="admin/boot.js"></script>
</head>
<body>
<div class="boot" id="bootView"><div class="spinner"></div></div>

<main class="login" id="loginView" hidden>
  <form class="login-card" id="loginForm" novalidate>
    <div class="login-brand"><img src="images/logo.webp" alt=""><div><strong data-t="app.title">GDF'27 Content Studio</strong><span data-t="app.subtitle">Website content management</span></div></div>
    <h1 data-t="login.title">Sign in to the CMS</h1>
    <p class="muted" data-t="login.text">Use your administrator account.</p>
    <label><span data-t="login.email">Email</span><input type="email" name="email" autocomplete="username" required></label>
    <label><span data-t="login.password">Password</span><input type="password" name="password" autocomplete="current-password" required></label>
    <p class="form-error" id="loginError" role="alert" hidden></p>
    <button class="btn btn-gold btn-block" type="submit" data-t="login.submit">Sign in</button>
    <div class="lang-pills" data-admin-lang></div>
  </form>
</main>

<div class="app" id="appView" hidden>
  <aside class="sidebar" id="sidebar">
    <div class="side-brand"><img src="images/logo.webp" alt=""><div><strong>GDF'27</strong><span data-t="app.subtitle">Website content management</span></div></div>
    <nav id="sideNav" aria-label="CMS"></nav>
    <div class="side-foot"><div class="who" id="who"></div></div>
  </aside>
  <div class="side-backdrop" id="sideBackdrop"></div>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-toggle" id="menuToggle" aria-label="Menu" type="button">☰</button>
      <div class="crumbs"><nav id="crumbs" class="crumb-trail" aria-label="Breadcrumb"></nav><h1 id="pageTitle"></h1><span class="dirty-badge" id="dirtyBadge" hidden data-t="msg.dirty">Unsaved changes</span></div>
      <div class="top-actions">
        <div class="lang-pills" data-admin-lang title="Interface language"></div>
        <button class="btn btn-ghost" id="previewToggle" type="button" hidden><span aria-hidden="true">◧</span> <span data-t="top.preview">Live preview</span></button>
        <a class="btn btn-ghost" href="./" target="_blank" rel="noopener"><span aria-hidden="true">↗</span> <span data-t="top.view">View website</span></a>
        <button class="btn btn-ghost" id="logoutBtn" type="button" data-t="top.logout">Log out</button>
      </div>
    </header>
    <div class="banner" id="banner" hidden></div>
    <div class="workspace">
      <section class="view" id="view" tabindex="-1"></section>
      <aside class="preview" id="preview" hidden>
        <div class="preview-bar"><span data-t="top.preview">Live preview</span><div class="preview-tools"><button type="button" class="chip" data-pv-lang="en">EN</button><button type="button" class="chip" data-pv-lang="ar">AR</button><button type="button" class="chip" data-pv-lang="tr">TR</button><button type="button" class="icon-btn" id="previewReload" aria-label="Reload">↻</button><button type="button" class="icon-btn" id="previewClose" aria-label="Close">✕</button></div></div>
        <iframe id="previewFrame" title="Preview"></iframe>
      </aside>
    </div>
  </div>
</div>

<div class="modal-root" id="modalRoot"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
